name: VoiceCallKitSwiftUI
options:
  bundleIdPrefix: ai.poly.examples
  deploymentTarget:
    iOS: "15.0"
packages:
  PolyMessaging:
    path: ../../../..
targets:
  VoiceCallKitSwiftUI:
    type: application
    platform: iOS
    sources:
      - path: .
        name: VoiceCallKitSwiftUI
        excludes:
          - project.yml
          - "*.xcodeproj"
          - Generated
          - build
          - .DS_Store
    dependencies:
      - package: PolyMessaging
        product: PolyVoice
    info:
      path: Generated/Info.plist
      properties:
        UILaunchScreen: {}
        NSMicrophoneUsageDescription: "Voice calls need the microphone to talk to the agent."
        UIBackgroundModes: [audio, voip]  # audio keeps the call alive; voip is REQUIRED for CallKit transactions
    settings:
      base:
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: NO
        SWIFT_VERSION: "5.9"
schemes:
  VoiceCallKitSwiftUI:
    build:
      targets:
        VoiceCallKitSwiftUI: all
