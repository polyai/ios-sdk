name: VoiceCallKitUIKit
options:
  bundleIdPrefix: ai.poly.examples
  deploymentTarget:
    iOS: "15.0"
packages:
  PolyMessaging:
    path: ../../../..
targets:
  VoiceCallKitUIKit:
    type: application
    platform: iOS
    sources:
      - path: .
        name: VoiceCallKitUIKit
        excludes:
          - project.yml
          - "*.xcodeproj"
          - Generated
          - build
          - .DS_Store
    dependencies:
      - package: PolyMessaging
        product: PolyVoice
    info:
      path: Generated/Info.plist
      properties:
        NSMicrophoneUsageDescription: "Voice calls need the microphone to talk to the agent."
        UIBackgroundModes: [audio]  # keep the call alive when the app is backgrounded
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
          UISceneConfigurations:
            UIWindowSceneSessionRoleApplication:
              - UISceneConfigurationName: Default Configuration
                UISceneDelegateClassName: $(PRODUCT_MODULE_NAME).SceneDelegate
    settings:
      base:
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: NO
        SWIFT_VERSION: "5.9"
schemes:
  VoiceCallKitUIKit:
    build:
      targets:
        VoiceCallKitUIKit: all
