name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  # Cancel superseded runs only for PRs; let every push to main run to completion
  # (so each merged commit is verified and reruns don't cancel each other).
  group: ci-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  pr-title:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Validate PR title follows conventional commits
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          pattern='^(feat|fix|docs|chore|test|refactor|style|ci|build|perf)(\(.+\))?!?: .+'
          if [[ ! "$PR_TITLE" =~ $pattern ]]; then
            echo "::error::PR title does not follow conventional commits format."
            echo "Expected: <type>[optional scope][!]: <description>"
            echo "See CONTRIBUTING.md for details."
            exit 1
          fi

  build-test:
    name: build-test
    runs-on: macos-14
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - name: Select stable Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - name: Swift version
        run: swift --version
      - name: Build
        run: swift build
      - name: Test
        run: swift test

  # `swift test` above runs on macOS, where the WebRTC dependency and the real
  # PolyVoice implementation are compiled out (#if os(iOS)). This leg builds and
  # tests the whole package — including the real WebRTC engine and the
  # PolyVoiceTests target — against an iOS simulator.
  ios-build-test:
    name: ios-build-test
    runs-on: macos-14
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v6
      - name: Select stable Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - name: Test on an iOS simulator
        run: |
          set -o pipefail
          # Select by UDID, not name. A bare `name=` lets xcodebuild default to
          # OS:latest, which fails when the first-listed iPhone has no simulator
          # for the newest installed runtime (e.g. iPhone 15 Pro is 17.x-only,
          # but Xcode's latest runtime is 18.x). A UDID pins device + runtime
          # together, so any available iPhone works regardless of OS.
          DEVICE_ID=$(xcrun simctl list devices available | grep 'iPhone' | grep -ioE '[0-9A-F]{8}-([0-9A-F]{4}-){3}[0-9A-F]{12}' | head -1)
          if [ -z "$DEVICE_ID" ]; then
            echo "::error::No available iPhone simulator found"
            xcrun simctl list devices available
            exit 1
          fi
          echo "Using simulator UDID: $DEVICE_ID"
          xcrun simctl list devices available | grep -i "$DEVICE_ID"
          xcodebuild -scheme PolyMessaging-Package \
            -destination "platform=iOS Simulator,id=$DEVICE_ID" \
            -skipPackagePluginValidation \
            test

  podspec-lint:
    name: podspec-lint
    runs-on: macos-14
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - name: Select stable Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      # Validates both podspecs compile for every declared platform.
      # --allow-warnings: the SDK build emits non-fatal compiler warnings that
      # would otherwise fail the lint, which treats warnings as errors.
      # PolyVoice depends on the sibling PolyMessaging podspec, which may not be
      # published yet at this version — resolve it locally via --include-podspecs.
      - name: pod lib lint PolyMessaging
        run: pod lib lint PolyMessaging.podspec --allow-warnings
      - name: pod lib lint PolyVoice
        run: pod lib lint PolyVoice.podspec --allow-warnings --include-podspecs=PolyMessaging.podspec
